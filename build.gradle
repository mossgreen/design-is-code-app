plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.designiscode'
version = '0.8.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.github.javaparser:javaparser-core:3.26.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    // FrontendChainTest, DesignAgreementTest and ReviewGateTest shell out to
    // `node src/test/js/*.js`. Gradle cannot see those files — they are read by
    // ProcessBuilder from the project directory, not from the classpath — so
    // without this the task reports UP-TO-DATE after a driver changes and reuses
    // the previous results. Editing a driver then looks green while nothing ran.
    // (app.js and diagram-svg.js need no such declaration: they live under
    // src/main/resources and reach the test classpath through processResources.)
    inputs.dir('src/test/js')
            .withPropertyName('frontendTestDrivers')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // Same reason: CoverageGovernanceTest parses these two at runtime, from the
    // project directory. Without declaring them, editing a claim in WHY.md or a
    // property row in TESTING.md leaves `:test` UP-TO-DATE — so the check that
    // exists to keep those files honest is the one that quietly stops running.
    inputs.files('TESTING.md', 'WHY.md')
            .withPropertyName('coverageGovernanceDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // Excludes @Tag("eval"): the analyzer eval shells out to the `claude` CLI
    // and costs real model calls — it must never fire from a plain `test` run
    // just because eval.properties happens to be configured. Run it via the
    // dedicated `eval` task below.
    useJUnitPlatform {
        excludeTags 'eval'
    }
    // Forward disc.stability.* into the test JVM: the foreign-repo derivation
    // check is opt-in (it needs a checkout to point at) but costs no model
    // calls, so it belongs in `test` rather than `eval`. Skips when unset.
    System.properties.each { k, v ->
        def key = k.toString()
        if (key.startsWith('disc.stability.')) systemProperty(key, v.toString())
    }
}

// Analyzer eval: `./gradlew eval [-Ddisc.eval.runs=3] [-Ddisc.eval.passRate=0.66]`.
// Opt-in (skips unless disc.eval.projectPath resolves); always reruns; streams
// per-run [eval] summaries; artifacts land in build/eval/<fixture>/.
tasks.register('eval', Test) {
    description = 'Runs the analyzer eval against the claude CLI (costs model calls).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'eval'
    }
    // Forward disc.eval.* (analyzer eval) and disc.diff.* (code→design round-trip
    // golden) -D flags from the gradle invocation into the test JVM.
    System.properties.each { k, v ->
        def key = k.toString()
        if (key.startsWith('disc.eval.') || key.startsWith('disc.diff.')) systemProperty(key, v.toString())
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

bootJar {
    archiveBaseName = 'disc-studio'
}

jar {
    enabled = false
}
