<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisC — Code→Design diff (Stage D review)</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155;
          --gen:#22c55e; --park:#f59e0b; --ask:#38bdf8; --accent:#6366f1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); }
  header b { color:#fff; } header span { color:var(--muted); }
  main { display:grid; grid-template-columns:380px 1fr; gap:0; height:calc(100vh - 58px); }
  .form { padding:18px 24px; border-right:1px solid var(--line); overflow:auto; }
  .out  { padding:18px 24px; overflow:auto; }
  label { display:block; color:var(--muted); margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  input, textarea { width:100%; background:#0b1220; color:var(--ink); border:1px solid var(--line);
                    border-radius:8px; padding:8px 10px; font-family:inherit; }
  textarea { min-height:150px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  textarea#sources { min-height:230px; }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:10px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-weight:700; font-size:12px; }
  .badge.generate { background:rgba(34,197,94,.15); color:var(--gen); }
  .badge.park { background:rgba(245,158,11,.15); color:var(--park); }
  .badge.ask  { background:rgba(56,189,248,.15); color:var(--ask); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
  .changes { width:100%; border-collapse:collapse; }
  .changes th, .changes td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .op { font-weight:700; font-size:11px; text-transform:uppercase; }
  .op.add { color:var(--gen); } .op.reuse { color:var(--muted); }
  .op.modify { color:var(--ask); } .op.extract-interface { color:var(--park); }
  pre { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:12px;
        overflow:auto; font-size:12.5px; }
  .muted { color:var(--muted); } .err { color:#f87171; }
  code { color:#c7d2fe; }
</style>
</head>
<body>
<header><b>DisC</b> <span>· Code→Design diff — review the design delta before it touches code</span></header>
<main>
  <section class="form">
    <label>Related files (separate with a line: <code>// ===</code>)</label>
    <textarea id="sources">package com.demo;
public record Order(Money subtotal, String destination) {}
// ===
package com.demo;
public record Money(java.math.BigDecimal amount) {}
// ===
package com.demo;
public interface TaxCalculator { Money calculate(Order order); }
// ===
package com.demo;
public class DomesticTax implements TaxCalculator {
    public Money calculate(Order order) { return order.subtotal(); }
}
// ===
package com.demo;
public class CheckoutService {
    private final TaxCalculator taxCalculator;
    public CheckoutService(TaxCalculator taxCalculator) { this.taxCalculator = taxCalculator; }
    public Money checkout(Order order) { return taxCalculator.calculate(order); }
}</textarea>
    <label>Entry class . method</label>
    <div style="display:flex; gap:8px;">
      <input id="entryClass" value="CheckoutService">
      <input id="entryMethod" value="checkout">
    </div>
    <label>Discriminator (code token the AC selects on)</label>
    <input id="discriminator" value="order.destination">
    <label>Variation point (callee type) · new variant</label>
    <div style="display:flex; gap:8px;">
      <input id="calleeType" value="TaxCalculator">
      <input id="newVariant" value="InternationalTax">
    </div>
    <label>Mapping (KEY=Strategy, comma-separated)</label>
    <input id="mapping" value="DOMESTIC=DomesticTax, INTERNATIONAL=InternationalTax">
    <label>Acceptance criteria (optional, corroborates)</label>
    <textarea id="acText" style="min-height:60px;">International orders should use the new tax calculator.</textarea>
    <label>Abstraction to extract (only if callee is concrete)</label>
    <input id="ifaceName" placeholder="e.g. TaxCalculator">
    <button id="preview">Preview design diff</button>
    <p class="muted" id="hint" style="font-size:12px;">Preview is read-only. Apply writes <code>design/*.puml</code> + sidecars; it never edits your code directly.</p>
  </section>
  <section class="out" id="out"><p class="muted">Fill the ticket on the left and preview the design diff.</p></section>
</main>

<script>
const $ = id => document.getElementById(id);
let lastArtifacts = null;

function parseMapping(s) {
  return s.split(',').map(p => p.trim()).filter(Boolean).map(p => {
    const [key, strategy] = p.split('=').map(x => (x || '').trim());
    return { key, strategy };
  });
}

async function preview() {
  const out = $('out');
  out.innerHTML = '<p class="muted">Deriving → classifying → diffing…</p>';
  const sources = $('sources').value.split(/\n\/\/ ===.*\n/).map(s => s.trim()).filter(Boolean);
  const body = {
    sources,
    entryClass: $('entryClass').value.trim(),
    entryMethod: $('entryMethod').value.trim(),
    discriminator: $('discriminator').value.trim(),
    acText: $('acText').value.trim() || null,
    request: {
      calleeType: $('calleeType').value.trim(),
      newVariant: $('newVariant').value.trim(),
      mapping: parseMapping($('mapping').value),
      strategyInterfaceName: $('ifaceName').value.trim() || null
    }
  };
  try {
    const resp = await fetch('/api/code-diff', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) { out.innerHTML = `<p class="err">${data.error || 'request failed'}</p>`; return; }
    render(data);
  } catch (e) { out.innerHTML = `<p class="err">${e.message}</p>`; }
}

function render(d) {
  lastArtifacts = d.artifacts || null;
  const disp = d.disposition;
  let html = `<div class="badge ${disp}">${disp.toUpperCase()}</div>`;
  html += `<span class="muted" style="margin-left:10px;">binding: <code>${d.classification.bindingTime}</code> · source: <code>${d.classification.discriminatorSource}</code></span>`;

  if (disp === 'ask') {
    html += `<div class="card"><b>One question before we proceed</b><p>${esc(d.classification.question || d.delta.reason)}</p></div>`;
  } else if (disp === 'park') {
    html += `<div class="card"><b>Parked (not generated in this phase)</b><p class="muted">${esc(d.delta.reason)}</p></div>`;
  } else {
    if (d.validationViolations && d.validationViolations.length) {
      html += `<div class="card err"><b>Delta not minimal:</b><ul>${d.validationViolations.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`;
    }
    if (d.warnings && d.warnings.length) {
      html += `<div class="card" style="border-color:var(--park)"><b style="color:var(--park)">Before you apply</b><ul>${d.warnings.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`;
    }
    html += `<div class="card"><b>Design delta</b> <span class="muted">— review at the altitude of leverage</span>`;
    html += `<table class="changes"><thead><tr><th>op</th><th>element</th><th>name</th><th>detail</th></tr></thead><tbody>`;
    for (const c of d.delta.changes) {
      html += `<tr><td class="op ${c.op}">${c.op}</td><td class="muted">${c.element}</td><td><code>${esc(c.name)}</code></td><td class="muted">${esc(c.detail)}</td></tr>`;
    }
    html += `</tbody></table></div>`;
    if (d.artifacts) {
      html += `<div class="card"><b>${esc(d.artifacts.pumlFileName)}</b><pre>${esc(d.artifacts.puml)}</pre></div>`;
      for (const s of d.artifacts.sidecars) {
        html += `<div class="card"><b>${esc(s.fileName)}</b><pre>${esc(s.content)}</pre></div>`;
      }
      html += `<label>Project path to apply into</label><input id="applyPath" placeholder="/path/to/project">
               <button id="applyBtn">Sign off & apply (writes design/ only)</button>
               <p class="muted" style="font-size:12px;">Overwrites <code>design/${esc(d.artifacts.pumlFileName)}</code> if it exists.</p>
               <p class="muted" id="applyMsg"></p>`;
    }
  }
  $('out').innerHTML = html;
  const ab = $('applyBtn'); if (ab) ab.addEventListener('click', apply);
}

async function apply() {
  const path = ($('applyPath').value || '').trim();
  const msg = $('applyMsg');
  if (!path) { msg.innerHTML = '<span class="err">Enter a project path.</span>'; return; }
  if (!lastArtifacts) return;
  msg.textContent = 'Writing design artifacts…';
  try {
    const resp = await fetch('/api/code-diff/apply', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ projectPath: path, artifacts: lastArtifacts })
    });
    const data = await resp.json();
    msg.innerHTML = resp.ok
      ? `Wrote <code>${esc(data.relativePath)}</code> + ${data.decisionTableCount} sidecar(s). Run the DisC plugin to generate code.`
      : `<span class="err">${esc(data.error || 'apply failed')}</span>`;
  } catch (e) { msg.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
$('preview').addEventListener('click', preview);
</script>
</body>
</html>
